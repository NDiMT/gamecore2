<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gamecore 2 — Co-op Realm Quest</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="app">

  <!-- LOBBY SCREEN -->
  <section id="screen-lobby" class="screen">
    <div class="title-wrap">
      <h1>Realm Quest</h1>
      <p class="subtitle">A co-op turn-based adventure — for 1 to 4 heroes.</p>
    </div>
    <div class="lobby-grid">
      <div class="card">
        <h2>Create Room</h2>
        <label>Your name <input id="create-name" maxlength="16" placeholder="Hero"></label>
        <button id="btn-create">Create</button>
      </div>
      <div class="card">
        <h2>Join Room</h2>
        <label>Your name <input id="join-name" maxlength="16" placeholder="Hero"></label>
        <label>Room code <input id="join-code" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"></label>
        <button id="btn-join">Join</button>
      </div>
      <div class="card">
        <h2>Load Game</h2>
        <label>Your name <input id="load-name" maxlength="16" placeholder="Hero"></label>
        <label>Save
          <select id="load-save"><option value="">(no saves)</option></select>
        </label>
        <button id="btn-load">Load</button>
      </div>
    </div>
    <p class="hint">Tip: share the 4-letter room code with friends, they pick "Join Room".</p>
  </section>

  <!-- WAITING / CHARACTER SELECT -->
  <section id="screen-room" class="screen hidden">
    <header class="topbar">
      <div>Room <b id="room-code">----</b></div>
      <div id="room-host"></div>
      <button id="btn-leave-1" class="ghost">Leave</button>
    </header>
    <h2>Pick your hero</h2>
    <div id="class-grid" class="class-grid"></div>
    <div id="party-list" class="party-list"></div>
    <div class="row">
      <button id="btn-start" disabled>Start Adventure</button>
    </div>
  </section>

  <!-- GAME SCREEN -->
  <section id="screen-game" class="screen hidden">
    <header class="topbar">
      <div>Room <b id="game-code">----</b></div>
      <div id="round-info">Round 1</div>
      <div id="turn-info">—</div>
      <div class="topbar-right">
        <button id="btn-inv" class="ghost">Inventory</button>
        <button id="btn-save" class="ghost">Save</button>
        <button id="btn-leave-2" class="ghost">Leave</button>
      </div>
    </header>

    <div class="game-layout">
      <aside id="party-panel" class="party-panel"></aside>

      <main class="center-pane">
        <div id="map-wrap" class="map-wrap">
          <canvas id="map-canvas" width="900" height="640"></canvas>
          <div id="map-overlay" class="map-overlay"></div>
        </div>

        <div id="combat-panel" class="hidden">
          <h3 id="combat-title">Combat</h3>
          <div id="enemy-row" class="enemy-row"></div>
          <div id="turn-order" class="turn-order"></div>
          <div id="combat-actions" class="combat-actions"></div>
        </div>

        <div id="event-panel" class="hidden">
          <h3 id="event-title">Event</h3>
          <p id="event-text"></p>
          <div id="event-choices" class="choices"></div>
        </div>

        <div id="shop-panel" class="hidden">
          <h3>Town &amp; Shop</h3>
          <div id="shop-stock" class="shop-stock"></div>
          <div class="row">
            <button id="btn-rest">Rest at Inn (15g)</button>
            <button id="btn-revive">Revive Fallen (50g)</button>
            <button id="btn-leave-shop">Leave Town</button>
          </div>
        </div>

        <div id="end-panel" class="hidden">
          <h2 id="end-title"></h2>
          <p id="end-text"></p>
          <button id="btn-back">Back to Lobby</button>
        </div>
      </main>

      <aside id="log-panel" class="log-panel">
        <h3>Adventure Log</h3>
        <ul id="log-list"></ul>
        <form id="chat-form">
          <input id="chat-input" placeholder="Say something…" maxlength="200">
        </form>
      </aside>
    </div>
  </section>

  <!-- MODAL: Inventory -->
  <div id="modal-inv" class="modal hidden">
    <div class="modal-card">
      <header><h3>Inventory</h3><button id="modal-inv-close" class="ghost">x</button></header>
      <div id="inv-body"></div>
    </div>
  </div>

  <!-- MODAL: Target picker (heal/items) -->
  <div id="modal-target" class="modal hidden">
    <div class="modal-card">
      <header><h3 id="target-title">Choose target</h3><button id="modal-target-close" class="ghost">x</button></header>
      <div id="target-body"></div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>
</div>
<script src="/client.js"></script>
</body>
</html>
